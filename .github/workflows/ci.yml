name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: gdlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Lint GDScript
        run: gdlint .
